<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Deep Obsidian Dark Gradient Background -->
    <linearGradient id="beDarkBg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#151A28"/>
      <stop offset="50%" stop-color="#0E121D"/>
      <stop offset="100%" stop-color="#06080F"/>
    </linearGradient>

    <!-- Theme Signature Dual Gradient: Lavender to Electric Mint -->
    <linearGradient id="beThemeGrad" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Border Specular Glow -->
    <linearGradient id="beBorderGlow" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.22)"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Ambient Center Light -->
    <radialGradient id="beAmbient" cx="16" cy="15" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0E121D" stop-opacity="0"/>
    </radialGradient>

    <!-- Fold Flap Gradient -->
    <linearGradient id="beFoldGrad" x1="18" y1="6" x2="23.5" y2="11.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- 1. Dark Obsidian Glass Squircle Base -->
  <rect width="32" height="32" rx="8" fill="url(#beDarkBg)"/>
  <rect width="32" height="32" rx="8" fill="url(#beAmbient)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" stroke="url(#beBorderGlow)" stroke-width="1.2" fill="none"/>
  
  <!-- Subtle Top Specular Glass Reflection -->
  <path d="M6 2.5 C12 2 20 2 26 2.5" stroke="rgba(255, 255, 255, 0.4)" stroke-width="0.75" stroke-linecap="round"/>

  <!-- 2. The BillEase Folded Document Sheet -->
  <!-- Document Body: Dark glass fill with glowing theme gradient stroke -->
  <path d="M9.5 6 H18.5 L23.5 11 V24.5 C23.5 25.33 22.83 26 22 26 H10 C9.17 26 8.5 25.33 8.5 24.5 V7.5 C8.5 6.67 9.17 6 10 6 Z"
        fill="#111624" stroke="url(#beThemeGrad)" stroke-width="1.6" stroke-linejoin="round"/>
  
  <!-- Top-Right Fold Flap (Lavender accent) -->
  <path d="M18.5 6 V10 C18.5 10.55 18.95 11 19.5 11 H23.5 Z" fill="url(#beFoldGrad)"/>
  
  <!-- 3. Document Content Lines (Invoice Lavender -> Indigo -> Bill Mint) -->
  <!-- Top Line: Lavender (Invoice) -->
  <line x1="12" y1="13" x2="16.5" y2="13" stroke="#DDD6FE" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Middle Line: Periwinkle/Indigo (Connected Service) -->
  <line x1="12" y1="17" x2="20" y2="17" stroke="#818CF8" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Bottom Line: Mint (Bill / Paid) -->
  <line x1="12" y1="21" x2="16.5" y2="21" stroke="#34D399" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Sparkle / Currency Ease Indicator in Electric Mint -->
  <circle cx="19.5" cy="21" r="1.3" fill="#34D399"/>
</svg>
